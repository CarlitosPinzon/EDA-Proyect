# Sirve la app Flutter Web y reenvía el API al gateway (mismo origen para el navegador).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # API REST y stream SSE -> gateway (YARP)
    location /api/ {
        # DNS interno de Docker: "gateway" se vuelve a resolver cada 10 s. Si el gateway se recrea y
        # cambia de IP, nginx no se queda con la vieja (lo que daría 502).
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $gateway http://gateway:8080;
        proxy_pass $gateway;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # Server-Sent Events: sin buffering y con conexiones largas.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        chunked_transfer_encoding on;
    }

    # SPA: cualquier ruta desconocida devuelve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html sin caché para que siempre cargue la versión nueva
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
